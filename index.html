<style>
/* ============================================================
   MEU TREINO VISUAL — folha de estilo
   ============================================================ */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F6F8FA;
  --ink:#131820; --muted:#69738220; --texto2:#697382;
  --line:#DBE1E9; --accent:#D6224C; --accent-ink:#FFFFFF;
  --ok:#0F9D8F; --alerta:#B45309;
  --sombra:0 1px 2px rgba(19,24,32,.06), 0 8px 24px rgba(19,24,32,.06);
  --raio:14px;
}
[data-tema="escuro"]{
  --bg:#12161C; --surface:#1A2029; --surface2:#212934;
  --ink:#E9EDF2; --texto2:#8B97A7;
  --line:#2A323D; --accent:#FF3B5F; --accent-ink:#12161C;
  --ok:#2BC5B4;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Inter',sans-serif; font-weight:700; letter-spacing:.01em; margin:0}
h1{font-size:29px; line-height:1.1}
h2{font-size:23px; line-height:1.15}
h3{font-size:19px}
a{color:var(--accent)}
button,input,select,textarea{font-family:inherit; font-size:15px; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- estrutura ---------- */
.topo{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:10px;
}
.marca{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:21px; line-height:1}
.marca span{display:block; font-family:'Inter'; font-weight:500; font-size:10px; color:var(--texto2); letter-spacing:.06em}
.topo .dir{margin-left:auto; display:flex; gap:6px}
.icone-btn{
  width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface2); cursor:pointer; font-size:17px; line-height:1;
  display:grid; place-items:center;
}
main{max-width:920px; margin:0 auto; padding:16px 16px 96px}
.rodape-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.rodape-nav button{
  background:none; border:0; cursor:pointer; padding:7px 2px 5px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; font-weight:500; color:var(--texto2); border-radius:10px;
}
.rodape-nav button i{font-style:normal; font-size:20px; line-height:1}
.rodape-nav button[aria-current="page"]{color:var(--accent)}

/* ---------- blocos ---------- */
.cartao{background:var(--surface); border:1px solid var(--line); border-radius:var(--raio); box-shadow:var(--sombra)}
.pad{padding:16px}
.linha{display:flex; align-items:center; gap:10px}
.entre{display:flex; align-items:center; justify-content:space-between; gap:10px}
.sec-titulo{display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 10px}
.sec-titulo p{margin:0; font-size:13px; color:var(--texto2)}
.discreto{color:var(--texto2); font-size:13px}

.btn{
  border:0; border-radius:12px; padding:13px 18px; font-weight:600; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); font-size:15px;
}
.btn:active{transform:translateY(1px)}
.btn.bloco{display:block; width:100%; text-align:center}
.btn.secundario{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
.btn.fantasma{background:transparent; color:var(--accent); padding:8px 10px}
.btn.perigo{background:transparent; color:var(--accent); border:1px solid var(--line)}
.btn.pequeno{padding:8px 12px; font-size:13.5px; border-radius:10px}
.btn[disabled]{opacity:.45; cursor:not-allowed}

label{display:block; font-size:12.5px; font-weight:600; color:var(--texto2); margin:12px 0 5px}
input,select,textarea{
  width:100%; background:var(--surface2); border:1px solid var(--line);
  border-radius:11px; padding:12px 13px;
}
textarea{min-height:92px; resize:vertical; line-height:1.45}
.grade2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grade3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}

.selo{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
  padding:3px 8px; border-radius:999px; background:var(--surface2);
  border:1px solid var(--line); color:var(--texto2); white-space:nowrap;
}
.selo.forte{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ---------- dias da semana ---------- */
.dias{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:14px 0}
.dias button{
  border:1px solid var(--line); background:var(--surface); border-radius:12px;
  padding:9px 0 8px; cursor:pointer; text-align:center; font-family:'Barlow Condensed';
  font-weight:600; font-size:15px; color:var(--texto2); position:relative;
}
.dias button.marcado{color:var(--ink)}
.dias button.marcado::after{
  content:""; position:absolute; left:50%; bottom:5px; translate:-50% 0;
  width:5px; height:5px; border-radius:50%; background:var(--accent);
}
.dias button.ativo{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.dias button.ativo::after{background:var(--accent-ink)}

/* ---------- destaque do treino de hoje ---------- */
.destaque{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  overflow:hidden; box-shadow:var(--sombra);
}
.destaque .faixa{background:var(--accent); color:var(--accent-ink); padding:9px 16px;
  font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.04em}
.destaque .corpo{padding:16px}
.contagem{font-family:'Barlow Condensed'; font-weight:700; font-size:52px; line-height:.9}
.tiras{display:flex; gap:6px; overflow:hidden; margin:12px 0 4px}
.tiras>*{flex:0 0 62px; height:62px; border-radius:10px; overflow:hidden}

/* ---------- cards de exercício ---------- */
.grade-ex{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
@media(min-width:700px){.grade-ex{grid-template-columns:repeat(3,1fr)}}
.card-ex{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--raio);
  overflow:hidden; cursor:pointer; box-shadow:var(--sombra); position:relative; text-align:left; padding:0;
}
.foto{aspect-ratio:4/3; width:100%; background:var(--surface2); position:relative; overflow:hidden}
.foto img{width:100%; height:100%; object-fit:cover; display:block}
.foto .vazio{
  width:100%; height:100%; display:grid; place-items:center; gap:2px;
  color:var(--texto2); font-size:26px;
  background:repeating-linear-gradient(45deg,var(--surface2) 0 10px,transparent 10px 20px);
}
.card-ex .txt{padding:9px 10px 11px}
.card-ex .nome{font-family:'Barlow Condensed'; font-weight:600; font-size:17px; line-height:1.1}
.card-ex .meta{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.coracao{
  position:absolute; top:6px; right:6px; width:32px; height:32px; border-radius:50%;
  border:0; background:rgba(255,255,255,.9); cursor:pointer; font-size:15px; line-height:1;
  display:grid; place-items:center;
}
[data-tema="escuro"] .coracao{background:rgba(0,0,0,.55)}

/* ---------- filtros ---------- */
.busca{position:relative}
.busca input{padding-left:38px}
.busca::before{content:"🔎"; position:absolute; left:12px; top:11px; font-size:15px}
.chips{display:flex; gap:7px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--texto2);
  border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600;
  white-space:nowrap; cursor:pointer;
}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}

/* ---------- caixas de marcação ---------- */
.marcadores{display:grid; gap:8px; margin-top:4px}
.marcador{
  display:flex; align-items:center; gap:9px; margin:0; font-size:14px; font-weight:500;
  color:var(--ink); border:1px solid var(--line); background:var(--surface2);
  border-radius:11px; padding:11px 13px; cursor:pointer;
}
.marcador input{width:19px; height:19px; margin:0; accent-color:var(--accent)}
.ficha{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}

/* ---------- zona de envio de imagem ---------- */
.zona{
  border:2px dashed var(--line); border-radius:14px; background:var(--surface2);
  min-height:150px; display:grid; place-items:center; text-align:center;
  padding:10px; cursor:pointer; overflow:hidden;
}
.zona.sobre{border-color:var(--accent); background:var(--surface)}
.zona img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; display:block}

/* ---------- modal ---------- */
.tela{
  position:fixed; inset:0; z-index:90; background:rgba(10,13,18,.55);
  display:flex; align-items:flex-end; justify-content:center;
}
.folha{
  background:var(--surface); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:0 0 24px;
}
@media(min-width:700px){.tela{align-items:center} .folha{border-radius:20px}}
.folha .cabeca{
  position:sticky; top:0; background:var(--surface); padding:14px 16px;
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; z-index:2;
}
.folha .conteudo{padding:16px}
.foto-grande{aspect-ratio:4/3; width:100%; background:var(--surface2)}
.foto-grande img{width:100%; height:100%; object-fit:cover}
ol,ul{margin:8px 0; padding-left:20px}
li{margin:5px 0}

/* ---------- modo treino ---------- */
.modo{position:fixed; inset:0; z-index:80; background:var(--bg); overflow-y:auto; padding-bottom:40px}
.barra-prog{height:5px; background:var(--line)}
.barra-prog>div{height:100%; background:var(--accent); transition:width .25s}
.cronometro{font-family:'Barlow Condensed'; font-weight:700; font-size:76px; line-height:1; text-align:center}
.pontos{display:flex; gap:7px; justify-content:center; margin:14px 0}
.ponto{width:13px; height:13px; border-radius:50%; border:2px solid var(--line)}
.ponto.feito{background:var(--accent); border-color:var(--accent)}

/* ---------- caixa de descanso ---------- */
.caixa-descanso{
  position:fixed; inset:0; z-index:85; background:rgba(10,13,18,.5);
  display:grid; place-items:center; padding:20px;
}
.caixa-descanso .interno{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  box-shadow:var(--sombra); padding:22px 20px; width:100%; max-width:330px; text-align:center;
}
.cronometro.alerta{color:var(--accent); animation:pisca .8s ease-in-out infinite}
@keyframes pisca{50%{opacity:.3}}

/* ---------- lista ---------- */
.item{
  display:flex; gap:11px; align-items:center; padding:10px;
  border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:8px;
}
.item .mini{flex:0 0 56px; height:56px; border-radius:9px; overflow:hidden; background:var(--surface2)}
.item .mini img{width:100%; height:100%; object-fit:cover}
.item .cresce{flex:1; min-width:0}
.item .cresce strong{font-family:'Barlow Condensed'; font-weight:600; font-size:17px; display:block}
.vazio-msg{text-align:center; padding:38px 20px; color:var(--texto2)}
.vazio-msg .emoji{font-size:34px; display:block; margin-bottom:8px}
.aviso{
  font-size:11.5px; color:var(--texto2); line-height:1.45;
  border-top:1px solid var(--line); margin-top:26px; padding-top:14px;
}
.recado{padding:11px 13px; border-radius:11px; background:var(--surface2); border:1px solid var(--line); font-size:13.5px; margin:10px 0}
.recado.erro{border-color:var(--accent); color:var(--accent)}
#toast{
  position:fixed; left:50%; bottom:84px; translate:-50% 0; z-index:99;
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px;
  font-size:14px; font-weight:500; box-shadow:var(--sombra); max-width:88vw; text-align:center;
}
/* ---------- login ---------- */
.login{min-height:100dvh; display:grid; place-items:center; padding:24px}
.login .caixa{width:100%; max-width:380px}
.login h1{font-size:38px; letter-spacing:-.01em}

<body data-tema="claro">

<div id="raiz"></div>

<script>
/* ============================================================
   MEU TREINO VISUAL
   Configuração — troque o nome do app e as chaves do Supabase.
   ============================================================ */
const CFG = {
  nome: 'Meu Treino Visual',
  versao: '1.4.0',
  bucket: 'exercicios',                // pasta de imagens no Supabase Storage
  supabaseUrl: 'https://attyhnudqfblvtyjcmyt.supabase.co',
  supabaseKey: 'sb_publishable_m2GHgT2iOnzi2gycA9Gshw_gVQo53qo',
  iaUrl: 'https://meu-treino.eneaspr.workers.dev'   // Worker que gera a sugestão por IA
};

/* Condições de saúde consideradas na sugestão de treino. */
const CONDICOES = [
  {slug:'coracao',      nome:'Doenças do coração'},
  {slug:'respiratorias',nome:'Doenças respiratórias'},
  {slug:'articulacoes', nome:'Articulações e ossos'},
  {slug:'metabolicas',  nome:'Condições metabólicas sistêmicas'}
];
const IMPACTO = ['burpee','pular-corda','polichinelo','escalador','afundo','kettlebell-swing'];

const DIAS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const DIAS_LONGO = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const LOCAIS = {casa:'Casa', academia:'Academia', ambos:'Casa e academia'};
const NIVEIS = {iniciante:'Iniciante', intermediario:'Intermediário', avancado:'Avançado'};

const S = {
  user:null, token:null, tela:'inicio',
  exercicios:[], grupos:[], equipamentos:[], favoritos:[],
  treinos:[], meusTreinos:[], historico:[], alunos:[],
  alunoSel:null, editor:null, sessao:null, cronometro:null,
  filtro:{busca:'', grupo:'', local:'', equip:'', nivel:'', sofavs:false},
  diaSel:new Date().getDay(), detalhe:null, picker:false, formAluno:null, formEx:null,
  sugestor:null
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grupoNome = slug => (S.grupos.find(g => g.slug === slug) || {}).nome || slug || '';
const equipNome = slug => (S.equipamentos.find(e => e.slug === slug) || {}).nome || slug || '';
const exPorId = id => S.exercicios.find(e => e.id === id);
const tempo = seg => `${String(Math.floor(seg/60)).padStart(2,'0')}:${String(seg%60).padStart(2,'0')}`;
const condNome = slug => (CONDICOES.find(c => c.slug === slug) || {}).nome || slug;
function idadeDe(nascimento){
  if (!nascimento) return null;
  const n = new Date(nascimento + 'T12:00:00'), h = new Date();
  let a = h.getFullYear() - n.getFullYear();
  const m = h.getMonth() - n.getMonth();
  if (m < 0 || (m === 0 && h.getDate() < n.getDate())) a--;
  return a >= 0 && a < 120 ? a : null;
}
const imcDe = p => (p.altura_cm && p.peso_kg) ? (p.peso_kg / Math.pow(p.altura_cm/100, 2)).toFixed(1) : null;
const dataBR = iso => new Date(iso).toLocaleDateString('pt-BR') + ' · ' + new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function toast(msg, erro){
  const velho = $('#toast'); if (velho) velho.remove();
  const d = document.createElement('div');
  d.id = 'toast'; d.textContent = msg;
  if (erro) d.style.background = 'var(--accent)', d.style.color = '#fff';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3400);
}

function tema(novo){
  const t = novo || localStorage.mtv_tema || 'claro';
  document.body.dataset.tema = t;
  localStorage.mtv_tema = t;
  if (novo) desenhar();
}

/* ---------- acesso ao Supabase ---------- */
async function rpc(fn, args = {}){
  if (CFG.supabaseUrl.startsWith('COLE')) throw new Error('Configure a URL e a chave do Supabase no início do arquivo.');
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:CFG.supabaseKey, Authorization:'Bearer ' + CFG.supabaseKey},
    body: JSON.stringify(args)
  });
  const txt = await r.text();
  let dado = null; try { dado = txt ? JSON.parse(txt) : null; } catch(e){ dado = txt; }
  if (!r.ok) throw new Error((dado && dado.message) || 'Não foi possível concluir. Tente de novo.');
  return dado;
}
async function tabela(consulta){
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${consulta}`, {
    headers:{apikey:CFG.supabaseKey, Authorization:'Bearer ' + CFG.supabaseKey}
  });
  if (!r.ok) throw new Error('Falha ao carregar os dados do catálogo.');
  return r.json();
}

/* ---------- imagens ---------- */
/* Converte endereços de página (Drive, Dropbox) no endereço direto do arquivo. */
function normalizarUrl(u){
  if (!u) return u;
  const drive = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{15,})/);
  if (drive) return `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w1200`;
  if (/dropbox\.com/.test(u)) return u.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace(/[?&]dl=0/, '');
  return u;
}

/* Reduz a imagem antes de enviar: menos espaço, carregamento mais rápido. */
function redimensionar(arquivo, maior = 1200){
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const escala = Math.min(1, maior / Math.max(img.width, img.height));
      const tela = document.createElement('canvas');
      tela.width = Math.round(img.width * escala);
      tela.height = Math.round(img.height * escala);
      tela.getContext('2d').drawImage(img, 0, 0, tela.width, tela.height);
      URL.revokeObjectURL(url);
      tela.toBlob(b => b ? ok(b) : falha(new Error('Não consegui processar esta imagem.')), 'image/jpeg', .85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Este arquivo não parece ser uma imagem.')); };
    img.src = url;
  });
}

async function enviarImagem(arquivo){
  const previa = $('#previa');
  if (!arquivo) return;
  if (!/^image\//.test(arquivo.type)) return toast('Escolha um arquivo de imagem (JPG, PNG ou WEBP).', true);
  if (previa) previa.innerHTML = '<span class="discreto">Enviando imagem…</span>';
  try{
    const blob = await redimensionar(arquivo);
    const nome = (($('#e-nome').value.trim() || 'exercicio')
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')) + '-' + Date.now() + '.jpg';
    const r = await fetch(`${CFG.supabaseUrl}/storage/v1/object/${CFG.bucket}/${nome}`, {
      method:'POST',
      headers:{apikey:CFG.supabaseKey, Authorization:'Bearer ' + CFG.supabaseKey,
               'Content-Type':'image/jpeg', 'x-upsert':'true'},
      body: blob
    });
    if (!r.ok){
      const t = await r.text();
      throw new Error(t.includes('row-level security') || t.includes('Unauthorized')
        ? 'O envio foi recusado. Rode o script storage-imagens.sql no Supabase para liberar a pasta de imagens.'
        : 'Não foi possível enviar a imagem.');
    }
    const publico = `${CFG.supabaseUrl}/storage/v1/object/public/${CFG.bucket}/${nome}`;
    $('#e-img').value = publico;
    if (previa) previa.innerHTML = `<img src="${publico}" alt="">`;
    toast('Imagem enviada.');
  }catch(e){
    if (previa) previa.innerHTML = '<span class="discreto">Arraste a imagem aqui ou toque para escolher</span>';
    toast(e.message, true);
  }
}

function foto(ex, classe){
  const cls = classe || 'foto';
  if (ex && ex.imagem_url)
    return `<div class="${cls}"><img src="${esc(normalizarUrl(ex.imagem_url))}" alt="${esc(ex.nome)}" loading="lazy"
      onerror="this.parentNode.innerHTML='<div class=\\'vazio\\'>🏋️</div>'"></div>`;
  return `<div class="${cls}"><div class="vazio">🏋️</div></div>`;
}

/* ============================================================
   CARGA
   ============================================================ */
async function carregarCatalogo(){
  const [gr, eq, ex] = await Promise.all([
    tabela('mtv_grupos?select=*&order=ordem'),
    tabela('mtv_equipamentos?select=*&order=nome'),
    tabela('mtv_exercicios?select=*&ativo=eq.true&order=nome')
  ]);
  S.grupos = gr; S.equipamentos = eq; S.exercicios = ex;
}
async function carregarAluno(){
  const [tr, hi, fa] = await Promise.all([
    rpc('mtv_treinos_listar', {p_token:S.token}),
    rpc('mtv_historico', {p_token:S.token}),
    rpc('mtv_favoritos_listar', {p_token:S.token})
  ]);
  S.treinos = tr || []; S.historico = hi || []; S.favoritos = fa || [];
}
async function carregarAdmin(){
  S.alunos = await rpc('mtv_alunos', {p_token:S.token}) || [];
  S.meusTreinos = await rpc('mtv_treinos_listar', {p_token:S.token, p_aluno:S.user.id}) || [];
}

async function iniciar(){
  tema();
  const t = localStorage.mtv_token;
  if (!t) return desenhar();
  try{
    S.token = t;
    S.user = await rpc('mtv_sessao', {p_token:t});
    await carregarCatalogo();
    if (S.user.papel === 'admin'){ S.tela = 'alunos'; await carregarAdmin(); }
    else { S.tela = 'inicio'; await carregarAluno(); }
  }catch(e){
    localStorage.removeItem('mtv_token'); S.token = null; S.user = null;
  }
  desenhar();
}

async function entrar(email, senha, botao){
  botao.disabled = true; botao.textContent = 'Entrando…';
  try{
    const r = await rpc('mtv_login', {p_email:email, p_senha:senha});
    S.token = r.token; localStorage.mtv_token = r.token;
    S.user = {id:r.id, nome:r.nome, email:r.email, papel:r.papel};
    await carregarCatalogo();
    if (r.papel === 'admin'){ S.tela = 'alunos'; await carregarAdmin(); }
    else { S.tela = 'inicio'; await carregarAluno(); }
    desenhar();
  }catch(e){
    botao.disabled = false; botao.textContent = 'Entrar';
    $('#erro-login').textContent = e.message;
    $('#erro-login').style.display = 'block';
  }
}
async function sair(){
  try{ await rpc('mtv_sair', {p_token:S.token}); }catch(e){}
  localStorage.removeItem('mtv_token');
  Object.assign(S, {user:null, token:null, treinos:[], historico:[], alunos:[], sessao:null});
  desenhar();
}

/* ============================================================
   DESENHO DAS TELAS
   ============================================================ */
function desenhar(){
  const r = $('#raiz');
  if (!S.user){ r.innerHTML = telaLogin(); return ligarLogin(); }
  if (S.sessao){ r.innerHTML = telaModoTreino(); return ligarModoTreino(); }

  const telas = {
    inicio:telaInicio, exercicios:telaExercicios, treino:telaMeuTreino,
    historico:telaHistorico, perfil:telaPerfil,
    alunos:telaAlunos, biblioteca:telaBiblioteca, montar:telaMontar, meutreino:telaMeuTreino
  };
  const corpo = (telas[S.tela] || telaInicio)();
  r.innerHTML = `${cabecalho()}<main>${corpo}</main>${navegacao()}
    ${S.detalhe ? modalDetalhe() : ''}${S.picker ? modalPicker() : ''}
    ${S.formAluno ? modalAluno() : ''}${S.formEx ? modalExercicio() : ''}${S.sugestor ? modalSugestor() : ''}`;
  ligarGeral();
}

function cabecalho(){
  return `<header class="topo">
    <div class="marca">${esc(CFG.nome)}<span>${S.user.papel === 'admin' ? 'Professor' : 'Aluno'} · v${CFG.versao}</span></div>
    <div class="dir">
      <button class="icone-btn" data-tema-toggle title="Alternar claro e escuro">${document.body.dataset.tema === 'escuro' ? '☀️' : '🌙'}</button>
      <button class="icone-btn" data-sair title="Sair">⏻</button>
    </div>
  </header>`;
}

function navegacao(){
  const itens = S.user.papel === 'admin'
    ? [['alunos','👥','Alunos'],['biblioteca','🏋️','Exercícios'],['montar','📋','Treinos'],['meutreino','🏃','Meu treino'],['historico','📈','Histórico'],['perfil','👤','Perfil']]
    : [['inicio','🏠','Início'],['exercicios','🏋️','Exercícios'],['treino','📋','Treino'],['historico','📈','Histórico'],['perfil','👤','Perfil']];
  return `<nav class="rodape-nav">${itens.map(([id,ic,nome]) =>
    `<button data-ir="${id}" ${S.tela === id ? 'aria-current="page"' : ''}><i>${ic}</i>${nome}</button>`).join('')}</nav>`;
}

/* ---------- login ---------- */
function telaLogin(){
  return `<div class="login"><div class="caixa">
    <h1>${esc(CFG.nome)}</h1>
    <p class="discreto" style="margin:6px 0 22px">Entre com o e-mail e a senha que seu professor cadastrou.</p>
    <div class="cartao pad">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="voce@email.com">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
      <div id="erro-login" class="recado erro" style="display:none"></div>
      <button class="btn bloco" id="btn-entrar" style="margin-top:16px">Entrar</button>
    </div>
    <div class="linha" style="justify-content:space-between; margin-top:14px">
      <span class="discreto">Versão ${CFG.versao}</span>
      <button class="icone-btn" data-tema-toggle>${document.body.dataset.tema === 'escuro' ? '☀️' : '🌙'}</button>
    </div>
  </div></div>`;
}
function ligarLogin(){
  const ir = () => entrar($('#email').value.trim(), $('#senha').value, $('#btn-entrar'));
  $('#btn-entrar').onclick = ir;
  $('#senha').onkeydown = e => { if (e.key === 'Enter') ir(); };
  document.querySelectorAll('[data-tema-toggle]').forEach(b =>
    b.onclick = () => tema(document.body.dataset.tema === 'escuro' ? 'claro' : 'escuro'));
}

/* ---------- início (aluno) ---------- */
function telaInicio(){
  const hoje = new Date().getDay();
  const doDia = S.treinos.filter(t => t.dia_semana === S.diaSel);
  const primeiro = S.treinos[0];
  return `
  <h2>Olá, ${esc(S.user.nome.split(' ')[0])}</h2>
  <p class="discreto">${DIAS_LONGO[hoje]}, ${new Date().toLocaleDateString('pt-BR')}</p>

  <div class="dias">${DIAS.map((d,i) => {
    const tem = S.treinos.some(t => t.dia_semana === i);
    return `<button data-dia="${i}" class="${i === S.diaSel ? 'ativo' : ''} ${tem ? 'marcado' : ''}">${d}</button>`;
  }).join('')}</div>

  ${doDia.length ? doDia.map(t => `
    <div class="destaque" style="margin-bottom:12px">
      <div class="faixa">${DIAS_LONGO[t.dia_semana].toUpperCase()}</div>
      <div class="corpo">
        <div class="entre">
          <div><h2>${esc(t.nome)}</h2>
            <span class="discreto">${t.itens.length} exercício${t.itens.length === 1 ? '' : 's'}</span></div>
          <div class="contagem">${t.itens.length}</div>
        </div>
        <div class="tiras">${t.itens.slice(0,5).map(i => foto({imagem_url:i.imagem_url, nome:i.nome}, 'foto')).join('')}</div>
        ${t.observacoes ? `<p class="discreto" style="margin:10px 0 0">${esc(t.observacoes)}</p>` : ''}
        <button class="btn bloco" style="margin-top:14px" data-iniciar="${t.id}">Iniciar treino</button>
      </div>
    </div>`).join('')
  : `<div class="cartao vazio-msg"><span class="emoji">🗓️</span>
       <strong>Sem treino para ${DIAS_LONGO[S.diaSel].toLowerCase()}</strong>
       <p class="discreto" style="margin:6px 0 0">${primeiro ? 'Toque em outro dia da semana para ver seus treinos.' : 'Seu professor ainda não montou seus treinos.'}</p>
     </div>`}

  <div class="sec-titulo"><h3>Atalhos</h3></div>
  <div class="grade3">
    <button class="cartao pad" data-ir="exercicios" style="cursor:pointer"><div style="font-size:22px">🏋️</div><strong class="cond">Exercícios</strong></button>
    <button class="cartao pad" data-favs style="cursor:pointer"><div style="font-size:22px">❤️</div><strong class="cond">Favoritos</strong></button>
    <button class="cartao pad" data-ir="historico" style="cursor:pointer"><div style="font-size:22px">📈</div><strong class="cond">Histórico</strong></button>
  </div>
  ${avisoSaude()}`;
}

/* ---------- biblioteca de exercícios (aluno) ---------- */
function filtrar(){
  const f = S.filtro, b = f.busca.toLowerCase();
  return S.exercicios.filter(e =>
    (!b || e.nome.toLowerCase().includes(b) || grupoNome(e.grupo).toLowerCase().includes(b) ||
      (e.equipamentos||[]).some(q => equipNome(q).toLowerCase().includes(b))) &&
    (!f.grupo || e.grupo === f.grupo || (e.secundarios||[]).includes(f.grupo)) &&
    (!f.local || e.local === f.local || e.local === 'ambos') &&
    (!f.equip || (e.equipamentos||[]).includes(f.equip)) &&
    (!f.nivel || e.dificuldade === f.nivel) &&
    (!f.sofavs || S.favoritos.includes(e.id))
  );
}

function abrirTreino(id){

  S.sessao = {treino:t, i:0, series:t.itens.map(() => 0), inicio:Date.now(), descanso:null, fim:false};
  desenhar();
}

        <div style="font-size:52px">🎉</div>

  const item = t.itens[s.i], ex = exPorId(item.exercicio_id) || item;

  const pct = Math.round((s.i / total) * 100);
  const d = s.descanso;

  return `<div class="modo">
    <div class="barra-prog"><div style="width:${pct}%"></div></div>
    <header class="topo" style="position:static">
      <div class="marca">Exercício ${s.i+1} de ${total}<span>${esc(t.nome)} · v${CFG.versao}</span></div>

      ${`
        <div class="cartao" style="overflow:hidden">

function ligarModoTreino(){
  const s = S.sessao;
  const q = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));

  q('[data-sair-treino]', () => {
    if (s.fim || confirm('Encerrar o treino? O que você fez não será salvo.')){
      pararCronometro(); S.sessao = null; S.detalhe = null; desenhar();
    }
  });
  q('[data-concluir]', () => {
    const item = s.treino.itens[s.i];
    s.series[s.i] = Math.min(s.series[s.i] + 1, item.series);
    if (s.series[s.i] >= item.series){
      if (s.i === s.treino.itens.length - 1){ s.fim = true; return desenhar(); }
      s.i++; s.descanso = {resta:item.descanso || 60, pausado:false};
    } else {
      s.descanso = {resta:item.descanso || 60, pausado:false};
    }
    desenhar(); iniciarCronometro();
  });
  q('[data-pausar]', () => { s.descanso.pausado = !s.descanso.pausado; desenhar(); if (!s.descanso.pausado) iniciarCronometro(); });
  q('[data-pular]', () => { pararCronometro(); s.descanso = null; desenhar(); });
  q('[data-proximo]', () => {
    if (s.i === s.treino.itens.length - 1){ s.fim = true; return desenhar(); }
    s.i++; desenhar();
  });
  q('[data-anterior]', () => { if (s.i > 0){ s.i--; desenhar(); } });
  q('[data-ver]', el => { S.detalhe = exPorId(el.dataset.ver) || null; desenhar(); ligarModoTreino(); });
  q('[data-fechar-btn]', () => { S.detalhe = null; desenhar(); ligarModoTreino(); });
  document.querySelectorAll('.tela').forEach(t => t.onclick = ev => {
    if (ev.target === t){ S.detalhe = null; S.formEx = null; desenhar(); ligarModoTreino(); }
  });

  if (S.user.papel === 'admin') ligarFormExercicio(q);
  if (S.formEx || S.detalhe){
    q('[data-fechar-btn]', () => { S.formEx = null; S.detalhe = null; desenhar(); });
  }

  const bs = $('#btn-salvar-sessao');
  if (bs) bs.onclick = async () => {
    bs.disabled = true; bs.textContent = 'Salvando…';
    try{
      await rpc('mtv_sessao_registrar', {p_token:S.token, p_dados:{
        treino_id:s.treino.id, treino_nome:s.treino.nome,
        iniciado_em:new Date(s.inicio).toISOString(),
        duracao_seg:Math.round((Date.now() - s.inicio)/1000),
        qtd_exercicios:s.treino.itens.length,
        qtd_series:s.series.reduce((a,b) => a+b, 0)
      }});
      S.historico = await rpc('mtv_historico', {p_token:S.token}) || [];
      S.sessao = null; S.tela = 'historico'; desenhar(); toast('Treino salvo no histórico.');
    }catch(e){ bs.disabled = false; bs.textContent = 'Salvar no histórico'; toast(e.message, true); }
  };

  if (s.descanso && !s.descanso.pausado) iniciarCronometro();
}
/* Apito curto para avisar o fim do descanso sem precisar olhar a tela. */
let audio = null;
function bipe(altura, duracao){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const som = audio.createOscillator(), volume = audio.createGain();
    som.type = 'sine'; som.frequency.value = altura;
    volume.gain.setValueAtTime(.0001, audio.currentTime);
    volume.gain.exponentialRampToValueAtTime(.3, audio.currentTime + .02);
    volume.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duracao);
    som.connect(volume); volume.connect(audio.destination);
    som.start(); som.stop(audio.currentTime + duracao);
  }catch(e){ /* sem som disponível, o aviso visual continua valendo */ }
}

function iniciarCronometro(){
  pararCronometro();
  S.cronometro = setInterval(() => {
    const d = S.sessao && S.sessao.descanso;
    if (!d || d.pausado) return pararCronometro();
    d.resta--;
    const r = $('#relogio'), aviso = $('#aviso-descanso');
    if (r) r.textContent = tempo(Math.max(0, d.resta));

    if (d.resta === 10){
      if (r) r.classList.add('alerta');
      if (aviso) aviso.textContent = 'Prepare-se!';
      if (navigator.vibrate) navigator.vibrate(120);
      bipe(660, .18);
    } else if (d.resta < 10 && d.resta > 0){
      bipe(660, .09);
    }

    if (d.resta <= 0){
      pararCronometro(); S.sessao.descanso = null;
      if (navigator.vibrate) navigator.vibrate([180,80,180]);
      bipe(980, .35);
      desenhar(); ligarModoTreino();
    }
  }, 1000);
}
function pararCronometro(){ if (S.cronometro) clearInterval(S.cronometro); S.cronometro = null; }

function gerarSugestao(aluno, opcoes){
  const idade = idadeDe(aluno.nascimento), cond = aluno.condicoes || [], notas = [];
  const cardiaco = cond.includes('coracao'), pulmonar = cond.includes('respiratorias');
  const articular = cond.includes('articulacoes'), metabolico = cond.includes('metabolicas');

  let base = S.exercicios.filter(e => opcoes.local === 'ambos' || e.local === opcoes.local || e.local === 'ambos');

  if (cardiaco || pulmonar || articular || (idade && idade >= 60)){
    base = base.filter(e => e.dificuldade !== 'avancado');
    notas.push('Exercícios de nível avançado foram deixados de fora.');
  }
  if (articular || cardiaco){
    base = base.filter(e => !IMPACTO.includes(e.slug));
    notas.push('Movimentos de impacto e salto foram evitados.');
  }
  const descansoExtra = (cardiaco ? 30 : 0) + (pulmonar ? 15 : 0);
  if (descansoExtra) notas.push(`Descanso aumentado em ${descansoExtra} segundos entre as séries.`);
  if (metabolico) notas.push('Vale conferir alimentação e horário do treino com o médico que acompanha.');
  if (aluno.observacoes) notas.push('A descrição da ficha não é lida por este rascunho — confira antes de salvar.');

  const foco = opcoes.foco.length ? opcoes.foco : ['corpo-inteiro','gluteos','peitoral','costas'];
  const escolhidos = [];
  const usar = e => { if (e && !escolhidos.find(x => x.id === e.id)) escolhidos.push(e); };

  // um de cada grupo do foco, alternando, até chegar na quantidade
  let volta = 0;
  while (escolhidos.length < opcoes.qtd && volta < 6){
    for (const grupo of foco){
      if (escolhidos.length >= opcoes.qtd) break;
      const candidatos = base.filter(e => e.grupo === grupo && !escolhidos.find(x => x.id === e.id));
      if (candidatos.length) usar(candidatos[Math.floor(Math.random() * candidatos.length)]);
    }
    volta++;
  }
  // completa com o que houver e fecha com mobilidade ou alongamento
  const sobra = base.filter(e => !escolhidos.find(x => x.id === e.id) && !['mobilidade','alongamento'].includes(e.grupo));
  while (escolhidos.length < opcoes.qtd && sobra.length) usar(sobra.splice(Math.floor(Math.random() * sobra.length), 1)[0]);
  const final = base.filter(e => ['alongamento','mobilidade'].includes(e.grupo));
  if (final.length) usar(final[Math.floor(Math.random() * final.length)]);

  if (!escolhidos.length){
    notas.push('Nenhum exercício do catálogo atendeu a esses filtros.');
    return {itens:[], notas};
  }

  // básicos e compostos primeiro, mobilidade e alongamento por último
  const peso = e => ['alongamento','mobilidade'].includes(e.grupo) ? 2 : (e.grupo === 'abdomen' ? 1 : 0);
  escolhidos.sort((a,b) => peso(a) - peso(b));

  const itens = escolhidos.map(e => ({
    exercicio_id:e.id,
    series:Math.max(2, (e.series_sug || 3) - (cardiaco || (idade && idade >= 65) ? 1 : 0)),
    reps:e.reps_sug || '12',
    duracao:e.duracao_sug || null,
    descanso:(e.descanso_sug || 60) + descansoExtra,
    observacoes:''
  }));
  notas.push('Rascunho gerado por regras do próprio app, sem avaliação clínica.');
  return {itens, notas};
}

async function sugestaoIA(aluno, opcoes){
  const resumo = {
    idade:idadeDe(aluno.nascimento), altura_cm:aluno.altura_cm, peso_kg:aluno.peso_kg,
    condicoes:(aluno.condicoes || []).map(condNome), objetivo:aluno.objetivo, descricao:aluno.observacoes
  };
  const catalogo = S.exercicios
    .filter(e => opcoes.local === 'ambos' || e.local === opcoes.local || e.local === 'ambos')
    .map(e => ({id:e.id, nome:e.nome, grupo:e.grupo, dificuldade:e.dificuldade, equipamentos:e.equipamentos}));
  const r = await fetch(CFG.iaUrl, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aluno:resumo, opcoes, exercicios:catalogo})
  });
  if (!r.ok) throw new Error('O serviço de IA não respondeu. Use o rascunho por regras.');
  const dado = await r.json();
  const validos = (dado.itens || []).filter(i => exPorId(i.exercicio_id));
  if (!validos.length) throw new Error('A IA não devolveu exercícios do catálogo.');
  return {
    nome:dado.nome || '',
    itens:validos.map(i => ({exercicio_id:i.exercicio_id, series:i.series || 3, reps:i.reps || '12',
      duracao:i.duracao || null, descanso:i.descanso || 60, observacoes:i.observacoes || ''})),
    notas:[...(dado.notas || []), 'Rascunho escrito por IA, sem avaliação clínica.']
  };
}

function ligarGeral(){
  const q = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = ev => fn(el, ev));

  q('[data-tema-toggle]', () => tema(document.body.dataset.tema === 'escuro' ? 'claro' : 'escuro'));
  q('[data-sair]', () => { if (confirm('Sair da conta?')) sair(); });
  q('[data-ir]', el => { S.tela = el.dataset.ir; if (S.tela === 'exercicios') S.filtro.sofavs = false; desenhar(); });
  q('[data-dia]', el => { S.diaSel = +el.dataset.dia; desenhar(); });
  q('[data-favs]', () => { S.tela = 'exercicios'; S.filtro.sofavs = true; desenhar(); });
  q('[data-limpar]', () => { S.filtro = {busca:'', grupo:'', local:'', equip:'', nivel:'', sofavs:false}; desenhar(); });
  q('[data-grupo]', el => { S.filtro.grupo = el.dataset.grupo; desenhar(); });
  q('[data-iniciar]', el => abrirTreino(el.dataset.iniciar));

  const busca = $('#busca');
  if (busca) busca.oninput = e => {
    S.filtro.busca = e.target.value;
    const foco = document.activeElement === busca;
    desenhar();
    if (foco){ const nova = $('#busca'); nova.focus(); nova.setSelectionRange(nova.value.length, nova.value.length); }
  };
  document.querySelectorAll('[data-f]').forEach(s => s.onchange = e => { S.filtro[s.dataset.f] = e.target.value; desenhar(); });

  // cartão do exercício: coração tem prioridade sobre abrir detalhe
  q('.card-ex[data-ex]', (el, ev) => {
    const coracao = ev.target.closest('[data-fav]');
    if (coracao) return alternarFavorito(coracao.dataset.fav);
    S.detalhe = exPorId(el.dataset.ex); desenhar();
  });
  q('.icone-btn[data-ex]', el => { S.detalhe = exPorId(el.dataset.ex); desenhar(); });
  q('.btn[data-fav]', el => alternarFavorito(el.dataset.fav));
  const fecharTudo = () => { S.detalhe = null; S.picker = false; S.formAluno = null; S.formEx = null; S.sugestor = null; desenhar(); };
  q('[data-fechar-btn]', fecharTudo);
  document.querySelectorAll('.tela').forEach(t => t.onclick = ev => { if (ev.target === t) fecharTudo(); });

  // trocar senha
  const bs = $('#btn-senha');
  if (bs) bs.onclick = async () => {
    const at = $('#s-atual').value, nv = $('#s-nova').value;
    if (!at || !nv) return toast('Preencha a senha atual e a nova.', true);
    bs.disabled = true;
    try{ await rpc('mtv_trocar_senha', {p_token:S.token, p_atual:at, p_nova:nv}); toast('Senha alterada.'); desenhar(); }
    catch(e){ bs.disabled = false; toast(e.message, true); }
  };

  // histórico do aluno (professor)
  const ha = document.querySelector('[data-hist-aluno]');
  if (ha) ha.onchange = async e => {
    S.alunoSel = e.target.value || null;
    S.historico = S.alunoSel ? (await rpc('mtv_historico', {p_token:S.token, p_aluno:S.alunoSel}) || []) : [];
    desenhar();
  };

  if (S.user.papel === 'admin') ligarAdmin(q);
}

async function alternarFavorito(id){
  try{
    const virou = await rpc('mtv_favorito_alternar', {p_token:S.token, p_exercicio:id});
    S.favoritos = virou ? [...S.favoritos, id] : S.favoritos.filter(f => f !== id);
    desenhar();
  }catch(e){ toast(e.message, true); }
}

function ligarAdmin(q){
  /* ----- alunos ----- */
  q('[data-novo-aluno]', () => { S.formAluno = {papel:'aluno'}; desenhar(); });
  q('[data-editar-aluno]', el => { S.formAluno = {...S.alunos.find(a => a.id === el.dataset.editarAluno)}; desenhar(); });
  const ba = $('#btn-salvar-aluno');
  if (ba) ba.onclick = async () => {
    const dados = {
      id:S.formAluno.id || null,
      nome:$('#a-nome').value.trim(), email:$('#a-email').value.trim(),
      senha:$('#a-senha').value, papel:$('#a-papel').value,
      telefone:$('#a-tel').value.trim(), objetivo:$('#a-obj').value.trim(),
      nascimento:$('#a-nasc').value, altura_cm:$('#a-alt').value,
      peso_kg:$('#a-peso').value, observacoes:$('#a-desc').value.trim(),
      condicoes:Array.from(document.querySelectorAll('[data-cond]:checked')).map(c => c.dataset.cond)
    };
    if (!dados.nome || !dados.email) return toast('Informe nome e e-mail.', true);
    ba.disabled = true; ba.textContent = 'Salvando…';
    try{
      await rpc('mtv_aluno_salvar', {p_token:S.token, p_dados:dados});
      await carregarAdmin(); S.formAluno = null; desenhar(); toast('Aluno salvo.');
    }catch(e){ ba.disabled = false; ba.textContent = 'Salvar aluno'; toast(e.message, true); }
  };
  q('[data-excluir-aluno]', async el => {
    if (!confirm('Excluir este aluno? Os treinos e o histórico dele também serão apagados.')) return;
    try{ await rpc('mtv_aluno_excluir', {p_token:S.token, p_id:el.dataset.excluirAluno});
      await carregarAdmin(); S.formAluno = null; desenhar(); toast('Aluno excluído.'); }
    catch(e){ toast(e.message, true); }
  });

  /* ----- exercícios ----- */
  q('[data-novo-ex]', () => { S.formEx = {grupo:S.grupos[0].slug, dificuldade:'iniciante', local:'ambos'}; desenhar(); });
  ligarFormExercicio(q);
  ligarAdminTreinos(q);
}

/* Formulário de exercício: usado no painel e também durante o treino. */
function ligarFormExercicio(q){
  q('[data-editar-ex]', el => { S.formEx = {...exPorId(el.dataset.editarEx)}; S.detalhe = null; desenhar(); });
  const be = $('#btn-salvar-ex');
  if (be) be.onclick = async () => {
    const linhas = id => $(id).value.split('\n').map(t => t.trim()).filter(Boolean);
    const multi = id => Array.from($(id).selectedOptions).map(o => o.value);
    const d = {
      id:S.formEx.id || null, nome:$('#e-nome').value.trim(), descricao:$('#e-desc').value.trim(),
      grupo:$('#e-grupo').value, secundarios:multi('#e-sec'), equipamentos:multi('#e-eq'),
      local:$('#e-local').value, dificuldade:$('#e-nivel').value,
      instrucoes:linhas('#e-ins'), erros:linhas('#e-err'),
      series_sug:$('#e-ser').value, reps_sug:$('#e-rep').value.trim(),
      duracao_sug:$('#e-dur').value, descanso_sug:$('#e-des').value,
      imagem_url:normalizarUrl($('#e-img').value.trim())
    };
    if (!d.nome) return toast('Informe o nome do exercício.', true);
    be.disabled = true; be.textContent = 'Salvando…';
    try{
      await rpc('mtv_exercicio_salvar', {p_token:S.token, p_dados:d});
      await carregarCatalogo(); S.formEx = null; desenhar(); toast('Exercício salvo.');
    }catch(e){ be.disabled = false; be.textContent = 'Salvar exercício'; toast(e.message, true); }
  };
  const zona = $('#zona'), arq = $('#e-arq');
  if (zona){
    zona.onclick = () => arq.click();
    zona.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') arq.click(); };
    zona.ondragover = ev => { ev.preventDefault(); zona.classList.add('sobre'); };
    zona.ondragleave = () => zona.classList.remove('sobre');
    zona.ondrop = ev => { ev.preventDefault(); zona.classList.remove('sobre'); enviarImagem(ev.dataTransfer.files[0]); };
    arq.onchange = ev => enviarImagem(ev.target.files[0]);
    const campo = $('#e-img');
    campo.onchange = () => {
      campo.value = normalizarUrl(campo.value.trim());
      $('#previa').innerHTML = campo.value
        ? `<img src="${campo.value}" alt="">`
        : '<span class="discreto">Arraste a imagem aqui ou toque para escolher</span>';
    };
  }

  q('[data-excluir-ex]', async el => {
    if (!confirm('Excluir este exercício? Ele sairá também dos treinos onde estiver.')) return;
    try{ await rpc('mtv_exercicio_excluir', {p_token:S.token, p_id:el.dataset.excluirEx});
      await carregarCatalogo(); S.formEx = null; desenhar(); toast('Exercício excluído.'); }
    catch(e){ toast(e.message, true); }
  });

}

function ligarAdminTreinos(q){
  /* ----- treinos ----- */
  q('[data-aluno]', async el => {
    S.alunoSel = el.dataset.aluno; S.editor = null;
    S.treinos = await rpc('mtv_treinos_listar', {p_token:S.token, p_aluno:S.alunoSel}) || [];
    desenhar();
  });
  q('[data-voltar-aluno]', () => { S.alunoSel = null; S.treinos = []; desenhar(); });
  q('[data-voltar-editor]', () => { S.editor = null; desenhar(); });
  q('[data-novo-treino]', () => { S.editor = {nome:'', dia_semana:1, observacoes:'', itens:[], notas:[]}; desenhar(); });
  q('[data-editar-treino]', el => {
    const t = S.treinos.find(x => x.id === el.dataset.editarTreino);
    S.editor = {id:t.id, nome:t.nome, dia_semana:t.dia_semana, observacoes:t.observacoes || '',
      itens:t.itens.map(i => ({exercicio_id:i.exercicio_id, series:i.series, reps:i.reps, duracao:i.duracao, descanso:i.descanso, observacoes:i.observacoes}))};
    desenhar();
  });
  q('[data-dia-ed]', el => { S.editor.dia_semana = +el.dataset.diaEd; guardarCampos(); desenhar(); });
  q('[data-abrir-picker]', () => { guardarCampos(); S.picker = true; desenhar(); });
  q('[data-add]', el => {
    const ex = exPorId(el.dataset.add);
    S.editor.itens.push({exercicio_id:ex.id, series:ex.series_sug || 3, reps:ex.reps_sug || '12',
      duracao:ex.duracao_sug || null, descanso:ex.descanso_sug || 60, observacoes:''});
    toast(`${ex.nome} adicionado.`);
    desenhar();
  });
  q('[data-subir]', el => { const n = +el.dataset.subir; guardarCampos();
    [S.editor.itens[n-1], S.editor.itens[n]] = [S.editor.itens[n], S.editor.itens[n-1]]; desenhar(); });
  q('[data-descer]', el => { const n = +el.dataset.descer; guardarCampos();
    [S.editor.itens[n+1], S.editor.itens[n]] = [S.editor.itens[n], S.editor.itens[n+1]]; desenhar(); });
  q('[data-remover]', el => { guardarCampos(); S.editor.itens.splice(+el.dataset.remover, 1); desenhar(); });

  q('[data-abrir-sugestor]', () => {
    guardarCampos();
    S.sugestor = {foco:[], qtd:5, local:'ambos'};
    desenhar();
  });
  q('[data-foco]', el => {
    const f = el.dataset.foco;
    S.sugestor.foco = S.sugestor.foco.includes(f)
      ? S.sugestor.foco.filter(x => x !== f) : [...S.sugestor.foco, f];
    lerOpcoesSugestor(); desenhar();
  });
  const aplicar = (resultado, aluno) => {
    if (!resultado.itens.length) return toast(resultado.notas[resultado.notas.length-1], true);
    S.editor.itens = resultado.itens;
    S.editor.notas = resultado.notas;
    if (!S.editor.nome) S.editor.nome = resultado.nome ||
      (S.sugestor.foco.length ? S.sugestor.foco.map(grupoNome).join(' e ') : 'Treino sugerido');
    S.sugestor = null; desenhar();
    toast('Rascunho pronto. Revise antes de salvar.');
  };
  const bg = $('#btn-gerar');
  if (bg) bg.onclick = () => {
    lerOpcoesSugestor();
    aplicar(gerarSugestao(S.alunos.find(a => a.id === S.alunoSel) || {}, S.sugestor));
  };
  const bgia = $('#btn-gerar-ia');
  if (bgia) bgia.onclick = async () => {
    lerOpcoesSugestor();
    bgia.disabled = true; bgia.textContent = 'Consultando a IA…';
    try{ aplicar(await sugestaoIA(S.alunos.find(a => a.id === S.alunoSel) || {}, S.sugestor)); }
    catch(e){ bgia.disabled = false; bgia.textContent = 'Gerar com IA'; toast(e.message, true); }
  };

  const bt = $('#btn-salvar-treino');
  if (bt) bt.onclick = async () => {
    guardarCampos();
    if (!S.editor.nome) return toast('Dê um nome ao treino.', true);
    if (!S.editor.itens.length) return toast('Adicione pelo menos um exercício.', true);
    bt.disabled = true; bt.textContent = 'Salvando…';
    try{
      await rpc('mtv_treino_salvar', {p_token:S.token, p_dados:{...S.editor, aluno_id:S.alunoSel}});
      S.treinos = await rpc('mtv_treinos_listar', {p_token:S.token, p_aluno:S.alunoSel}) || [];
      await carregarAdmin(); S.editor = null; desenhar(); toast('Treino salvo.');
      if (S.alunoSel === S.user.id) S.meusTreinos = S.treinos;
    }catch(e){ bt.disabled = false; bt.textContent = 'Salvar treino'; toast(e.message, true); }
  };
  q('[data-excluir-treino]', async el => {
    if (!confirm('Excluir este treino?')) return;
    try{
      await rpc('mtv_treino_excluir', {p_token:S.token, p_id:el.dataset.excluirTreino});
      S.treinos = await rpc('mtv_treinos_listar', {p_token:S.token, p_aluno:S.alunoSel}) || [];
      await carregarAdmin(); S.editor = null; desenhar(); toast('Treino excluído.');
    }catch(e){ toast(e.message, true); }
  });
}

function lerOpcoesSugestor(){
  if (!S.sugestor) return;
  const q = $('#g-qtd'), l = $('#g-local');
  if (q) S.sugestor.qtd = +q.value;
  if (l) S.sugestor.local = l.value;
}

/* guarda o que está digitado no editor antes de redesenhar a tela */
function guardarCampos(){
  if (!S.editor) return;
  const n = $('#t-nome'), o = $('#t-obs');
  if (n) S.editor.nome = n.value.trim();
  if (o) S.editor.observacoes = o.value.trim();
  document.querySelectorAll('[data-campo]').forEach(el => {
    const it = S.editor.itens[+el.dataset.i];
    if (!it) return;
    it[el.dataset.campo] = el.dataset.campo === 'series' || el.dataset.campo === 'descanso'
      ? (parseInt(el.value, 10) || 0) : el.value;
  });
}

iniciar();
</script>
